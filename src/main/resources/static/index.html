<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinLens — Financial Intelligence</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=9">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-mark">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2L2 19h20L12 2z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                            <circle cx="12" cy="13" r="3" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                    </div>
                    <div>
                        <span class="brand-name">FinLens</span>
                        <span class="brand-sub">Financial Intelligence</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="section-label">Knowledge Bases</div>
                <div class="kb-create">
                    <input type="text" id="kb-name" placeholder="Enter name, press Enter...">
                    <button id="kb-create-btn" title="Create knowledge base">Create</button>
                </div>
                <div id="kb-list" class="kb-list"></div>
            </div>

            <!-- Documents panel -->
            <div id="docs-panel" class="sidebar-section docs-panel" style="display:none;">
                <div class="section-label-row">
                    <span class="section-label">Documents</span>
                    <label for="file-input" class="upload-trigger">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        Upload
                    </label>
                    <input type="file" id="file-input" accept=".pdf" style="display:none">
                </div>
                <div id="docs-list" class="docs-list"></div>
                <div id="upload-zone" class="upload-zone" style="display:none;">
                    <p>Drop PDF here</p>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <!-- Empty state -->
            <div id="empty-state" class="empty-state">
                <div class="empty-icon">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
                        <path d="M12 2L2 19h20L12 2z"/>
                        <circle cx="12" cy="13" r="3"/>
                    </svg>
                </div>
                <h1>Welcome to FinLens</h1>
                <p>Extract structured financial data from any filing.<br>Validate with XBRL. Compare across jurisdictions.</p>
            </div>

            <!-- KB view -->
            <div id="kb-view" class="kb-view" style="display:none;">
                <!-- Tab bar -->
                <nav class="tab-bar">
                    <button class="tab active" data-tab="dashboard" onclick="switchTab('dashboard')">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                        Dashboard
                    </button>
                    <button class="tab" data-tab="compare" onclick="switchTab('compare')">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                        Compare
                    </button>
                    <button class="tab" data-tab="chat" onclick="switchTab('chat')">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                        Chat
                    </button>
                </nav>

                <!-- Dashboard -->
                <div id="tab-dashboard" class="tab-content active">
                    <div id="dashboard-empty" class="tab-empty">
                        <span class="tab-empty-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                        </span>
                        Select a document to view financial data
                    </div>
                    <div id="dashboard-content" style="display:none;"></div>
                </div>

                <!-- Compare -->
                <div id="tab-compare" class="tab-content">
                    <div class="compare-panel">
                        <div class="compare-toolbar">
                            <h2>Cross-Company Comparison</h2>
                            <button id="compare-btn" class="btn-accent" onclick="runComparison()" disabled>Compare</button>
                        </div>
                        <div id="compare-doc-selector" class="compare-chips"></div>
                    </div>
                    <div id="compare-results" class="compare-results"></div>
                </div>

                <!-- Chat -->
                <div id="tab-chat" class="tab-content">
                    <div id="messages" class="messages"></div>
                    <div class="chat-input-bar">
                        <input type="text" id="query-input" placeholder="Ask about the documents...">
                        <button id="send-btn" class="btn-accent">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/app.js?v=9"></script>
</body>
</html>
