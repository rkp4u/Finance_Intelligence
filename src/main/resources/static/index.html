<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinLens — Financial Intelligence</title>
    <link rel="stylesheet" href="/css/style.css?v=4">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <svg class="brand-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 22 22 22"></polygon>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    <span class="brand-name">FinLens</span>
                </div>
                <span class="brand-sub">Financial Intelligence</span>
            </div>

            <div class="kb-create">
                <input type="text" id="kb-name" placeholder="New knowledge base...">
                <button id="kb-create-btn">+</button>
            </div>

            <div id="kb-list" class="kb-list"></div>

            <!-- Documents panel (shown when KB selected) -->
            <div id="docs-panel" class="docs-panel" style="display:none;">
                <div class="docs-panel-header">
                    <h3>Documents</h3>
                    <label for="file-input" class="upload-btn-small">Upload</label>
                    <input type="file" id="file-input" accept=".pdf" style="display:none">
                </div>
                <div id="docs-list" class="docs-list"></div>

                <!-- Drop zone (hidden, shows on drag) -->
                <div id="upload-zone" class="upload-zone" style="display:none;">
                    <p>Drop PDF here</p>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <!-- No KB selected -->
            <div id="empty-state" class="empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent); margin-bottom: 16px;">
                    <polygon points="12 2 2 22 22 22"></polygon>
                    <line x1="12" y1="8" x2="12" y2="16"></line>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
                <h2>Welcome to FinLens</h2>
                <p>Upload financial filings and extract structured data with AI-powered validation</p>
            </div>

            <!-- KB selected -->
            <div id="kb-view" class="kb-view" style="display:none;">
                <!-- Tab bar -->
                <div class="tab-bar">
                    <button class="tab active" data-tab="dashboard" onclick="switchTab('dashboard')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        Dashboard
                    </button>
                    <button class="tab" data-tab="compare" onclick="switchTab('compare')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                        Compare
                    </button>
                    <button class="tab" data-tab="chat" onclick="switchTab('chat')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg>
                        Chat
                    </button>
                </div>

                <!-- Dashboard Tab -->
                <div id="tab-dashboard" class="tab-content active">
                    <div id="dashboard-empty" class="tab-empty">
                        <p>Select a document from the sidebar to view extracted financial data</p>
                    </div>
                    <div id="dashboard-content" style="display:none;">
                        <!-- Extraction header -->
                        <div id="extraction-header" class="extraction-header"></div>
                        <!-- Financial cards grid -->
                        <div id="fin-grid" class="fin-grid"></div>
                        <!-- Validation checks -->
                        <div id="validation-section" class="validation-section" style="display:none;">
                            <h3>Validation Checks</h3>
                            <div id="validation-checks" class="validation-checks"></div>
                        </div>
                    </div>
                </div>

                <!-- Compare Tab -->
                <div id="tab-compare" class="tab-content">
                    <div class="compare-controls">
                        <div class="compare-header">
                            <h3>Cross-Company Comparison</h3>
                            <button id="compare-btn" onclick="runComparison()" disabled>Compare Selected</button>
                        </div>
                        <div id="compare-doc-selector" class="compare-doc-selector"></div>
                    </div>
                    <div id="compare-results" class="compare-results"></div>
                </div>

                <!-- Chat Tab -->
                <div id="tab-chat" class="tab-content">
                    <div id="messages" class="messages"></div>
                    <div class="chat-input">
                        <input type="text" id="query-input" placeholder="Ask a question about the documents...">
                        <button id="send-btn">Send</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/app.js?v=4"></script>
</body>
</html>
