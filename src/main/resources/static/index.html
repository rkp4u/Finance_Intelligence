<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-K RAG</title>
    <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>10-K RAG</h1>
            </div>
            <div class="kb-create">
                <input type="text" id="kb-name" placeholder="New knowledge base name...">
                <button id="kb-create-btn">Create</button>
            </div>
            <div id="kb-list" class="kb-list">
                <!-- Knowledge bases populated by JS -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <!-- No KB selected state -->
            <div id="empty-state" class="empty-state">
                <h2>Select or create a knowledge base</h2>
                <p>Upload 10-K filings and query them with natural language</p>
            </div>

            <!-- KB selected state -->
            <div id="kb-view" class="kb-view" style="display:none;">
                <!-- Upload Area -->
                <div class="upload-section">
                    <div id="upload-zone" class="upload-zone">
                        <p>Drop PDF here or <label for="file-input" class="upload-label">browse</label></p>
                        <input type="file" id="file-input" accept=".pdf" style="display:none">
                    </div>
                </div>

                <!-- Documents List -->
                <div id="docs-section" class="docs-section">
                    <h3>Documents</h3>
                    <div id="docs-list" class="docs-list"></div>
                </div>

                <!-- Chat Area -->
                <div class="chat-section">
                    <div id="messages" class="messages"></div>
                    <div class="chat-input">
                        <input type="text" id="query-input" placeholder="Ask a question about the documents...">
                        <button id="send-btn">Send</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/app.js?v=3"></script>
</body>
</html>
